<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>生产链路快照</title><style>html,body,iframe{border:0;margin:0;width:100%;height:100%;display:block}p{padding:24px;font:16px system-ui}</style><p id="message">正在打开生产链路…</p><script>
(async()=>{try{const id=new URLSearchParams(location.search).get('id');if(!/^[0-9a-f]{32}$/.test(id||''))throw Error('快照编号无效');const db=await new Promise((resolve,reject)=>{const r=indexedDB.open('game-economy-chain-snapshots',1);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});const snapshot=await new Promise((resolve,reject)=>{const r=db.transaction('snapshots').objectStore('snapshots').get(id);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});db.close();if(!snapshot)throw Error('当前浏览器没有此快照，请回加工工具重新生成');const frame=document.createElement('iframe');frame.title='商品与建筑生产链路';frame.srcdoc=snapshot.html;document.body.replaceChildren(frame)}catch(error){document.getElementById('message').textContent=error.message}})();
</script></html>
